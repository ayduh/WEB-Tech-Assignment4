<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 4 - Form and Validation</title>
</head>
<body>
  <main>
    <form>
      <label for="fname">First Name</label>
      <input type="name" required id="fname"><br>
      <label for="lname">Last Name</label>
      <input type="name" required id="lname"><br>
      <label for="email">Email</label>
      <input type="email" pattern="[^@]+@[^@]+\.[a-zA-Z]{2,}" required id="email"><br>
      <label for="message">Message</label>
      <input type="text" maxlength="9" id="message"><br>
      <input type="submit">
    </form>

    <a href="bsform.html">Part 2</a>
  </main>
</body>
</html>
